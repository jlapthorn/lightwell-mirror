# Copy to repos.toml and edit. Repo names must match SEED_REPOS in
# compose.yaml. Credentials come from environment variables, never from this
# file:
#   export MIRROR_USERNAME=svc-mirror
#   read -rs MIRROR_PASSWORD && export MIRROR_PASSWORD

[defaults]
output_dir = "./mirror"          # one subfolder per repo, plus _manifests/
workers = 8                      # parallel HTTP requests
username_env = "MIRROR_USERNAME" # set username_env = "" on a repo that is public
password_env = "MIRROR_PASSWORD"
# ca_bundle = "/etc/pki/ca-trust/source/anchors/corp-root-ca.pem"
# insecure = false               # skip TLS verification (avoid)
# timeout = 120
# retries = 4

# method = "auto" picks:
#   pypi                         -> simple   (PEP 503/691 index)
#   maven, URL has /repository/  -> nexus    (Nexus 3 REST assets API)
#   maven, URL has /artifactory/ -> artifactory (storage list API)
#   otherwise                    -> html     (crawl directory listings)

# --- Lightwell public demo: no credentials needed ---------------------------

[[repo]]
name = "java-remediated"
format = "maven"
url = "https://packages.redhat.com/lightwell/public-lightwell-demo/java/remediated/"
username_env = ""
# paths = ["org/springframework/"]             # only these subtrees
# exclude = ["*-javadoc.jar", "*-sources.jar"]  # fnmatch; "*" also matches "/"

[[repo]]
name = "java-validated"
format = "maven"
url = "https://packages.redhat.com/lightwell/public-lightwell-demo/java/validated/"
username_env = ""

[[repo]]
name = "python-validated"
format = "pypi"
url = "https://packages.redhat.com/lightwell/public-lightwell-demo/python/validated/simple/"
username_env = ""

# --- Lightwell full repos: need a service account ---------------------------
# The full indexes are very large and slow to list; use `projects` to mirror
# only what you need.

[[repo]]
name = "python-remediated"
format = "pypi"
url = "https://packages.redhat.com/lightwell/python/remediated/simple/"
projects = ["jinja2"]

