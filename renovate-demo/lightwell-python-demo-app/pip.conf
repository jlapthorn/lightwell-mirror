# Resolve packages from the offline Nexus group "pypi-lightwell", which
# searches in this order (first match wins):
#   1. python-remediated  Lightwell rebuilds with backported CVE fixes (+rhlw.N)
#   2. python-validated   upstream packages Lightwell has validated
#   3. pypi-extras        dependencies Lightwell doesn't ship
# pip doesn't read a project-local config by itself; point it here with
#   PIP_CONFIG_FILE=pip.conf pip install -r requirements.txt
[global]
index-url = http://localhost:8081/repository/pypi-lightwell/simple/
